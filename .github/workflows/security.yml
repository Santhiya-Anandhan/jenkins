
name: Security Pipeline

on:
  push:
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Packages
        run: |
          python -m pip install flask bandit pip-audit

      - name: Build
        run: python -m compileall app.py

      - name: Test
        run: python -m unittest -v test_app

      - name: SAST Scan
        run: bandit -r app.py

      - name: SCA Scan
        run: pip-audit -r requirements.txt

      - name: Generate Security Reports
        if: always()
        run: |
          bandit -r app.py -f json -o bandit-report.json || true
          pip-audit -r requirements.txt --format=json -o pip-audit-report.json || true

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
